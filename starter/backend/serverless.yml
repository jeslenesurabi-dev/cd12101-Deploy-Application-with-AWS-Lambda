service: serverless-todo-app

plugins:
  - serverless-iam-roles-per-function
  - serverless-reqvalidator-plugin

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region : ap-south-1
  stage: dev
  tracing: 
    lambda: true
    apiGateway: true
  environment:
    TODOS_TABLE: TodosTable
    TODOS_CREATED_AT_INDEX: CreatedAtIndex
    ATTACHMENT_S3_BUCKET: serverless_todo_attachments_${self:provider.stage}
    SIGNED_URL_EXPIRATION: 300

functions:

  Auth:
    handler: src/lambda/auth/auth0Authorizer.handler

  # TODO: Configure this function
  GetTodos:
    handler: src/lambda/http/getTodos.handler
    events:
      - http:
          method: get
          path: todos
          cors: true
          authorizer: Auth
    iamRoleStatements:
      -Effect: Allow
       Action:
         -dynamodb.Query
       Resource:
          -arn:aws:dynamodb:${self:provider.region}:*:table/TodosTable/Index/CreatedAtIndex
          -arn:aws:dynamodb:${self:provider.region}:*:table/TodosTable

  # TODO: Configure this function
  CreateTodo:
    handler: src/lambda/http/createTodo.handler
    events:
      - http:
          method: post
          path: todos
          cors: true
          authorizer: Auth
          request:
            schemas:
              application/json: ${file(models/create-todo.json)}
      iamRoleStatements:
      -Effect: Allow
       Action:
         -dynamodb.PutItem
       Resource:
          -arn:aws:dynamodb:${self:provider.region}:*:table/TodosTable

  # TODO: Configure this function
  UpdateTodo:
    handler: src/lambda/http/updateTodo.handler
    events:
      - http:
          method: patch
          path: todos/{todoId}
          cors: true
          authorizer: Auth
          request:
            schemas:
              application/json: ${file(models/update-todo.json)}
    iamRoleStatements:
      -Effect: Allow
       Action:
         -dynamodb.UpdateItem
       Resource:
          -arn:aws:dynamodb:${self:provider.region}:*:table/TodosTable


  # TODO: Configure this function
  DeleteTodo:
    handler: src/lambda/http/deleteTodo.handler
    events:
      - http:
          method: delete
          path: todos/{todoId}
          cors: true
          authorizer: Auth
    iamRoleStatements:
      -Effect: Allow
       Action:
         -dynamodb.deleteItem
       Resource:
          -arn:aws:dynamodb:${self:provider.region}:*:table/TodosTable

  # TODO: Configure this function
  GenerateUploadUrl:
    handler: src/lambda/http/generateUploadUrl.handler
    events:
      - http:
          method: post
          path: todos/{todoId}/attachment
          cors: true
          authorizer: Auth
    iamRoleStatements:
      -Effect: Allow
       Action:
         -dynamodb.PutObject
       Resource:
          -arn:aws:s3:::dynamodb:serverless-todo-attachments-${self:provider.stage}/*

resources:
  Resources:
    # TODO: Add any necessary AWS resources
    TodosTable:
      Type: AWS:DynamoDB::Table
      properties:
      TableName: TodosTable
      AttributeDefinitions:
        -AttributeName: userId
        -AttributeType: S
        -AttributeName: todoId
        -AttributeType: S
        -AttributeName: createdAt
        -AttributeType: S
    KeySchema:
      -AttributeName: userId
      -AttributeType: HASH
      -AttributeName: todoId
      -AttributeType: RANGE
    GlobalSecondaryIndexes:
      -IndexName: CreatedAtIndex
       KeySchema:
         -AttributeName: userId
         -keyType: HASH
         -AttributeName: createdAt
         -keyType: RANGE
      Projection:
        ProjectionType: ALL
    BillingMode: PAY_PER_REQUEST
AttachmentsBucket:
  Type: AWS::S3:Bucket
  Properties:
    BucketName: serverless-todo-attachments-${self:provider.stage}
    CorsConfiguration:
      CorsRules:
        -AllowedMethods:
           - GET
           - PUT
         AllowedOrigins:
            - '*'
         AllowedHeaders:
            - '*'

BucketPolicy:
  Type: AWS::S3::BucketPolicy
  Properties:
    Bucket: serverless-todo-attachements-${self.provider.stage}
    PolicyDocument:
      Statement:
        -Effect: Allow
         Principal: '*'
         Action: s3:GetPbject
         Resource: arn:aws:s3:::serverless-todo-attachements-${self:provider.stage}/*
